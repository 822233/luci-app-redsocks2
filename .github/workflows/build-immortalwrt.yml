name: Build Redsocks2 for ImmortalWrt 24.10 (mediatek/filogic)

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: ImmortalWrt mediatek/filogic SDK archive URL
        required: true
        default: https://downloads.immortalwrt.org/releases/24.10-SNAPSHOT/targets/mediatek/filogic/immortalwrt-sdk-24.10-SNAPSHOT-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  push:
    branches:
      - immortalwrt-24.10-https

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout package source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget zstd

      - name: Download and unpack ImmortalWrt SDK
        env:
          SDK_URL: ${{ github.event.inputs.sdk_url || 'https://downloads.immortalwrt.org/releases/24.10-SNAPSHOT/targets/mediatek/filogic/immortalwrt-sdk-24.10-SNAPSHOT-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst' }}
        run: |
          wget -q "$SDK_URL" -O /tmp/immortalwrt-sdk.tar.zst
          mkdir -p "$RUNNER_TEMP/sdk"
          tar --zstd -xf /tmp/immortalwrt-sdk.tar.zst -C "$RUNNER_TEMP/sdk" --strip-components=1

      - name: Prepare package feeds
        working-directory: ${{ runner.temp }}/sdk
        run: |
          ./scripts/feeds update packages luci
          ./scripts/feeds install -p packages libevent2
          ./scripts/feeds install -p luci luci-base
          mkdir -p package/redsocks2
          cp -a "$GITHUB_WORKSPACE/redsocks2/." package/redsocks2/
          mkdir -p feeds/luci/applications/luci-app-redsocks2
          cp "$GITHUB_WORKSPACE/Makefile" feeds/luci/applications/luci-app-redsocks2/
          cp -a "$GITHUB_WORKSPACE/luasrc" feeds/luci/applications/luci-app-redsocks2/
          cp -a "$GITHUB_WORKSPACE/root" feeds/luci/applications/luci-app-redsocks2/
          if [ -d "$GITHUB_WORKSPACE/po" ]; then
            cp -a "$GITHUB_WORKSPACE/po" feeds/luci/applications/luci-app-redsocks2/
          fi
          printf '\nCONFIG_PACKAGE_libevent2=y\nCONFIG_PACKAGE_libevent2-openssl=y\nCONFIG_PACKAGE_libopenssl=y\nCONFIG_PACKAGE_redsocks2=m\nCONFIG_PACKAGE_luci-app-redsocks2=m\n' >> .config
          make defconfig

      - name: Compile packages
        working-directory: ${{ runner.temp }}/sdk
        run: |
          make package/redsocks2/compile -j2 V=s
          make package/luci-app-redsocks2/compile -j2 V=s

      - name: Collect IPK packages
        working-directory: ${{ runner.temp }}/sdk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find bin/packages -type f \\( -name 'redsocks2_*.ipk' -o -name 'luci-app-redsocks2_*.ipk' \\) -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \\;
          test -n "$(find "$GITHUB_WORKSPACE/dist" -name '*.ipk' -print -quit)"

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redsocks2-immortalwrt-mediatek-filogic
          path: dist/*.ipk
          if-no-files-found: error
